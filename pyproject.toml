[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-portfolio-optimizer"
version = "0.3.0"
description = "Moteur d'optimisation de portefeuille quantum-inspired (expérimental — pas un conseil financier)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mdavo5270-create" }]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
viz = ["matplotlib>=3.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "network: tests qui nécessitent un accès réseau (yfinance, etc.)",
]
